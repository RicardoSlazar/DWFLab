<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Registro</title>

  <link rel="stylesheet"
        href="css/styles.css">

</head>

<body>

<div class="container">

  <div class="card">

    <h1>Crear cuenta</h1>


    <input
            type="text"
            id="username"
            placeholder="Usuario"
    >

    <input
            type="password"
            id="password"
            placeholder="Contraseña"
    >

    <input
            type="text"
            id="firstname"
            placeholder="Nombre"
    >

    <input
            type="text"
            id="lastname"
            placeholder="Apellido"
    >

    <input
            type="number"
            id="age"
            placeholder="Edad"
    >


    <button onclick="registrar()">

      Registrarse

    </button>

    <br><br>

    <a href="index.html">

      Volver al login

    </a>

    <p id="mensaje"></p>

  </div>

</div>

<script src="js/register.js"></script>

</body>

</html>
